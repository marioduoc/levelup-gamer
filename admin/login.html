<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Level-Up Gamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">

  <form id="form-admin-login" class="form-card" novalidate>
    <p class="logo" style="text-align:center; margin-bottom:0.5rem;">LEVEL<span>UP</span> GAMER</p>
    <h1 class="section-title" style="margin-top:0; border:none; padding-left:0; text-align:center;">Panel administrador</h1>

    <div class="form-group">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>
      <span class="error-msg"></span>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
      <span class="error-msg"></span>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%">Ingresar</button>

    <p id="login-error" class="login-feedback login-feedback-error" style="display:none;">
      Credenciales incorrectas.
    </p>

    <p class="form-footer"><a href="../index.html">← Volver a la tienda</a></p>
  </form>

  <script src="js/admin.js"></script>
  <script>
    const form = document.getElementById("form-admin-login");
    const inputCorreo = document.getElementById("correo");
    const inputPassword = document.getElementById("password");
    const errorGeneral = document.getElementById("login-error");

    function mostrarError(input, mensaje) {
      const span = input.parentElement.querySelector(".error-msg");
      if (span) span.textContent = mensaje;
      input.setAttribute("aria-invalid", "true");
    }

    function limpiarErrores() {
      form.querySelectorAll(".error-msg").forEach((s) => (s.textContent = ""));
      [inputCorreo, inputPassword].forEach((i) => i.removeAttribute("aria-invalid"));
      errorGeneral.style.display = "none";
    }

    // Al escribir de nuevo, se limpia el error de ese campo
    [inputCorreo, inputPassword].forEach((input) => {
      input.addEventListener("input", () => {
        const span = input.parentElement.querySelector(".error-msg");
        if (span) span.textContent = "";
        input.removeAttribute("aria-invalid");
        errorGeneral.style.display = "none";
      });
    });

    form.addEventListener("submit", (evento) => {
      evento.preventDefault();
      limpiarErrores();

      const correo = inputCorreo.value.trim();
      const password = inputPassword.value;
      let primerInvalido = null;

      if (correo === "") {
        mostrarError(inputCorreo, "Ingresa tu correo.");
        primerInvalido = primerInvalido || inputCorreo;
      } else if (!inputCorreo.checkValidity()) {
        mostrarError(inputCorreo, "El correo no tiene un formato válido.");
        primerInvalido = primerInvalido || inputCorreo;
      }

      if (password === "") {
        mostrarError(inputPassword, "Ingresa tu contraseña.");
        primerInvalido = primerInvalido || inputPassword;
      }

      if (primerInvalido) {
        primerInvalido.focus();
        return;
      }

      if (iniciarSesionAdmin(correo, password)) {
        window.location.href = "index.html";
      } else {
        errorGeneral.style.display = "block";
        inputPassword.value = "";
        inputCorreo.focus();
      }
    });
  </script>
</body>
</html>
