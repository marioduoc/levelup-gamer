<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Level-Up Gamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">

  <form id="form-admin-login" class="form-card" novalidate>
    <p class="logo" style="text-align:center; margin-bottom:0.5rem;">LEVEL<span>UP</span> GAMER</p>
    <h1 class="section-title" style="margin-top:0; border:none; padding-left:0; text-align:center;">Panel administrador</h1>

    <div class="form-group">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>
      <span class="error-msg"></span>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
      <span class="error-msg"></span>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%">Ingresar</button>

    <p id="login-error" class="login-feedback login-feedback-error" style="display:none;">
      Credenciales incorrectas.
    </p>

    <p class="form-footer"><a href="../index.html">← Volver a la tienda</a></p>
  </form>

  <script src="js/admin.js"></script>
  <script>
    document.getElementById("form-admin-login").addEventListener("submit", (evento) => {
      evento.preventDefault();
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value;
      const error = document.getElementById("login-error");

      if (iniciarSesionAdmin(correo, password)) {
        window.location.href = "index.html";
      } else {
        error.style.display = "block";
      }
    });
  </script>
</body>
</html>
