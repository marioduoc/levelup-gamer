<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Admin Level-Up Gamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="logo">LEVEL<span>UP</span> GAMER</p>
      <a href="index.html">Dashboard</a>
      <a href="productos.html" class="active">Productos</a>
      <a href="usuarios.html">Usuarios</a>
      <a href="../index.html">Ver tienda</a>
      <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1 class="section-title" style="margin:0;">Productos</h1>
        <a href="producto-form.html" class="btn btn-primary">+ Nuevo producto</a>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos">
        </tbody>
      </table>
    </main>
  </div>

  <script src="../js/products.js"></script>
  <script src="js/admin.js"></script>
  <script>
    protegerPaginaAdmin();

    function renderizarTablaProductos() {
      const cuerpo = document.getElementById("tabla-productos");
      const lista = obtenerProductos();

      cuerpo.innerHTML = lista.map(p => `
        <tr>
          <td>${p.codigo}</td>
          <td>${p.nombre}</td>
          <td>${p.categoria}</td>
          <td>${formatearPrecio(p.precio)}</td>
          <td>${p.stock <= (p.stockCritico ?? 0) ? `<span class="stock-badge ${p.stock <= 0 ? "stock-agotado" : "stock-critico"}">${p.stock}</span>` : p.stock}</td>
          <td class="acciones">
            <a href="producto-form.html?codigo=${p.codigo}" class="btn-sm btn-editar">Editar</a>
            <button type="button" class="btn-sm btn-eliminar" data-codigo="${p.codigo}">Eliminar</button>
          </td>
        </tr>
      `).join("");

      cuerpo.querySelectorAll(".btn-eliminar").forEach(boton => {
        boton.addEventListener("click", () => {
          if (confirm("¿Eliminar este producto del catálogo?")) {
            eliminarProducto(boton.dataset.codigo);
            renderizarTablaProductos();
          }
        });
      });
    }

    document.addEventListener("DOMContentLoaded", renderizarTablaProductos);
    document.getElementById("btn-logout").addEventListener("click", cerrarSesionAdmin);
  </script>
</body>
</html>
